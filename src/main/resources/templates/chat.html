<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chatMessages {
            max-height: 60vh;
            min-height: 50vh;
            overflow-y: auto;
            background-color: #f8f9fa;
        }
        .chat-bubble-user {
            background-color: #0d6efd;
            color: #ffffff;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            max-width: 75%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .chat-bubble-assistant {
            background-color: #e9ecef;
            color: #212529;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            max-width: 75%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .chat-bubble-error {
            background-color: #dc3545;
            color: #ffffff;
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            max-width: 75%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div th:replace="~{navbar.html}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">AI Chat</h1>
            <button id="newChatBtn" class="btn btn-outline-secondary btn-sm">New Chat</button>
        </div>

        <div id="chatMessages" class="card p-3 mb-3 d-flex flex-column gap-2">
            <div class="chat-bubble-assistant align-self-start">Hello! I am your AI assistant. How can I help you today?</div>
        </div>

        <div class="input-group">
            <input id="messageInput" type="text" class="form-control" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn" class="btn btn-primary" type="button">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const messages = [
                { role: 'system', content: 'You are a helpful assistant.' }
            ];
            const messagesEl = document.getElementById('chatMessages');
            const inputEl = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const newChatBtn = document.getElementById('newChatBtn');

            function appendBubble(text, cls) {
                const div = document.createElement('div');
                div.className = cls + ' align-self-' + (cls === 'chat-bubble-user' ? 'end' : 'start');
                div.textContent = text;
                messagesEl.appendChild(div);
                scrollToBottom();
                return div;
            }

            function scrollToBottom() {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function setBusy(busy) {
                sendBtn.disabled = busy;
                inputEl.disabled = busy;
                sendBtn.textContent = busy ? 'Thinking...' : 'Send';
            }

            async function sendMessage() {
                const text = inputEl.value.trim();
                if (!text || sendBtn.disabled) return;

                inputEl.value = '';
                messages.push({ role: 'user', content: text });
                appendBubble(text, 'chat-bubble-user');
                setBusy(true);

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: messages })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.error || 'Request failed (' + res.status + ')');
                    }
                    messages.push({ role: 'assistant', content: data.reply });
                    appendBubble(data.reply, 'chat-bubble-assistant');
                } catch (err) {
                    appendBubble('Error: ' + err.message, 'chat-bubble-error');
                } finally {
                    setBusy(false);
                    inputEl.focus();
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            inputEl.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') sendMessage();
            });
            newChatBtn.addEventListener('click', function () {
                messages.length = 0;
                messages.push({ role: 'system', content: 'You are a helpful assistant.' });
                messagesEl.innerHTML = '';
                appendBubble('Hello! I am your AI assistant. How can I help you today?', 'chat-bubble-assistant');
            });
        })();
    </script>
</body>
</html>
