<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navbar.html}"></div>
    <div class="container mt-5">
        <h1 class="mb-4">Knowledge Management</h1>

        <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary" onclick="showAddModal()">Add Knowledge</button>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>Title</th>
                                        <th>Content</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="knowledgeTableBody">
                                    <tr>
                                        <td colspan="5" class="text-center">
                                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                            Loading knowledge entries...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="knowledgeModal" tabindex="-1">
        <div class="modal-dialog" style="width: 90%; max-width: none; margin: 5%; height: 90%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Knowledge</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="knowledgeForm">
                        <input type="hidden" id="knowledgeId">

                        <div class="mb-3">
                            <label for="title" class="form-label">Title *</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Content *</label>
                            <textarea class="form-control" id="content" rows="6" required style="overflow: auto; resize: vertical;"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveKnowledge()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadKnowledgeList();
        });

        function loadKnowledgeList() {
            fetch('/api/knowledge')
                .then(response => response.json())
                .then(data => {
                    console.log('Knowledge data received:', data);
                    renderTable(data);
                })
                .catch(error => {
                    console.error('Error loading knowledge list:', error);
                    document.getElementById('knowledgeTableBody').innerHTML =
                        '<tr><td colspan="5" class="text-center text-danger">Error loading knowledge entries</td></tr>';
                });
        }

        function renderTable(data) {
            const tbody = document.getElementById('knowledgeTableBody');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No knowledge entries found</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(item.title)}</td>
                    <td>${escapeHtml(item.content.length > 50 ? item.content.substring(0, 50) + '...' : item.content)}</td>
                    <td>${escapeHtml(formatDate(item.createdAt || item.created_at))}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editKnowledge('${item.knowledgeId}')">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteKnowledge('${item.knowledgeId}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                let date;
                if (Array.isArray(dateString)) {
                    // Handle array format [year, month, day, hour, minute, second, nanosecond]
                    date = new Date(dateString[0], dateString[1] - 1, dateString[2], dateString[3] || 0, dateString[4] || 0, dateString[5] || 0);
                } else {
                    // Handle ISO string format
                    date = new Date(dateString);
                }
                return date.toLocaleDateString();
            } catch (e) {
                console.error('Error parsing date:', dateString, e);
                return 'Invalid Date';
            }
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Knowledge';
            document.getElementById('knowledgeId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            document.getElementById('knowledgeForm').classList.remove('was-validated');

            const modal = new bootstrap.Modal(document.getElementById('knowledgeModal'));
            modal.show();
        }

        function editKnowledge(id) {
            fetch(`/api/knowledge/${id}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('modalTitle').textContent = 'Edit Knowledge';
                    document.getElementById('knowledgeId').value = data.knowledgeId;
                    document.getElementById('title').value = data.title;
                    document.getElementById('content').value = data.content;

                    const modal = new bootstrap.Modal(document.getElementById('knowledgeModal'));
                    modal.show();
                })
                .catch(error => {
                    console.error('Error loading knowledge:', error);
                    alert('Error loading knowledge entry');
                });
        }

        function saveKnowledge() {
            const form = document.getElementById('knowledgeForm');
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const knowledgeId = document.getElementById('knowledgeId').value;
            const knowledgeData = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value
            };

            const method = knowledgeId ? 'PUT' : 'POST';
            const url = knowledgeId ? `/api/knowledge/${knowledgeId}` : '/api/knowledge';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(knowledgeData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                bootstrap.Modal.getInstance(document.getElementById('knowledgeModal')).hide();
                loadKnowledgeList();
                showAlert('Knowledge saved successfully!', 'success');
            })
            .catch(error => {
                console.error('Error saving knowledge:', error);
                showAlert(`Error saving knowledge: ${error.message}`, 'danger');
            });
        }

        function deleteKnowledge(id) {
            if (!confirm('Are you sure you want to delete this knowledge entry?')) {
                return;
            }

            fetch(`/api/knowledge/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                loadKnowledgeList();
                showAlert('Knowledge deleted successfully!', 'success');
            })
            .catch(error => {
                console.error('Error deleting knowledge:', error);
                showAlert('Error deleting knowledge', 'danger');
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `${escapeHtml(message)}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            document.body.appendChild(alertDiv);

            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
